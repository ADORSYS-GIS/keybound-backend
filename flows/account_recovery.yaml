flow_type: account_recovery
human_id_prefix: rc
feature: flow-account-recovery
initial_step: init_recovery

steps:
  init_recovery:
    action: WAIT
    actor: END_USER
    config:
      actor: USER
    next: resolve_existing_account

  # Enumeration-safe account resolution. Matches exactly one existing account
  # by phone; unknown/ambiguous numbers take the no_match branch (no OTP is
  # ever sent and existence is never disclosed).
  resolve_existing_account:
    action: RESOLVE_EXISTING_ACCOUNT
    actor: SYSTEM
    config:
      phone_source: session
    branches:
      matched: issue_recovery_otp
      no_match: no_match_terminal
    fail: FAILED

  issue_recovery_otp:
    action: ISSUE_RECOVERY_OTP
    actor: SYSTEM
    config:
      length: 6
      expiry_seconds: 1800
      resend_cooldown_seconds: 30
      max_attempts: 5
    branches:
      cooldown: issue_recovery_otp
    next: verify_recovery_otp
    fail: FAILED

  verify_recovery_otp:
    action: VERIFY_RECOVERY_OTP
    actor: END_USER
    config:
      input_field: code
      max_attempts: 5
      attempts_field: otp_attempts
    branches:
      verified: await_admin_decision
      retry: verify_recovery_otp
    fail: FAILED

  # KYC Manager review via staff_flow (ADMIN actor). Evidence is verified
  # out-of-band by the reviewer; keybound only records the decision.
  await_admin_decision:
    action: WAIT
    actor: ADMIN
    config:
      actor: ADMIN
    next: record_admin_decision

  record_admin_decision:
    action: CONDITIONAL
    actor: SYSTEM
    config:
      source: flow
      pointer: /step_output/await_admin_decision/decision
      cases:
        APPROVED: approved_hold
        REJECTED: rejected_terminal
      default_branch: rejected_terminal
    branches:
      approved_hold: approved_hold
      rejected_terminal: rejected_terminal
    fail: FAILED

  # Approval does NOT bind the device here. Device binding and old-device/session
  # finalization are security-critical and are owned by the Keycloak SPI path
  # driven through the BFF /complete (proof-validated challenge signature), never
  # by keybound's own flow execution. The case therefore HOLDS in the APPROVED
  # state (a WAIT) until that external, proof-validated bind finalizes it.
  #
  # The out-of-band finalization path (owned by the BFF, not this flow) is:
  #   POST /bff/v1/recoveries/{caseId}/device-bindings   (bind the new device)
  #   POST /bff/v1/recoveries/{caseId}/old-devices/policy (revoke/quarantine old)
  #   POST /bff/v1/recoveries/{caseId}/complete           (mark the case COMPLETED)
  # The BFF advances this step by submitting it AFTER a successful bind; the
  # NOOP transition below then completes the flow to COMPLETED. The recovery-case
  # status transition is monotonic (see sync_recovery_case), so a COMPLETED case
  # is never regressed back to APPROVED by a later projection from this RUNNING
  # hold step.
  approved_hold:
    action: WAIT
    actor: END_USER
    config:
      actor: USER
    next: APPROVED

  # Terminal step reached when the BFF submits `approved_hold` after a
  # successful out-of-band bind. NOOP completes the flow to COMPLETED (the case
  # status is driven monotonic by sync_recovery_case, so COMPLETED sticks even if
  # the case was already finalized via /complete).
  APPROVED:
    action: NOOP
    actor: SYSTEM

  no_match_terminal:
    action: DEBUG_LOG
    actor: SYSTEM
    config:
      message: "Recovery: no safe match; case held for review-only (enumeration-safe, no OTP)"
    # A "no safe match" must NOT self-complete: completing would leak account
    # existence and falsely signal success. It follows the same public shape as a
    # matched case and is routed into review, where a human differentiates it.
    next: await_admin_decision

  rejected_terminal:
    action: CLOSE_SESSION
    actor: SYSTEM
    config:
      reason: REJECTED_BY_ADMIN
    next: CLOSED
