services:
  keycloak-healthcheck-builder:
    image: rust:1-alpine
    depends_on:
      download-core-tools:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - |
        set -eux
        rm -rf /work
        mkdir -p /work
        cp -R /src/. /work/
        cd /work
        cargo build --release
        cp target/release/keycloak-healthcheck /data/bin/keycloak-healthcheck
        chmod +x /data/bin/keycloak-healthcheck
    volumes:
      - ../../.docker/keycloak-healthcheck:/src:ro
      - downloaded_data:/data

  # Strict runtime provisioning of the keybound Keycloak provider. This stack
  # expects the keybound SPI (recovery/device-key) provider, so this service
  # FAILS CLOSED: if the required provider JARs cannot be obtained from the last
  # released keybound version, the whole environment fails loudly rather than
  # starting an apparently-healthy Keycloak without the provider. Codegen does
  # NOT depend on this (see download-core-tools in tools.compose.yml).
  download-keycloak-plugins:
    image: alpine/curl
    environment:
      KEYCLOAK_PLUGIN_VERSION: "0.2.6"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    command:
      - /bin/sh
      - -c
      - |
        set -ex;
        mkdir -p /data/kc-plugins
        apk add --no-cache jq

        gh_download() {
          output="$$1"
          asset_name="$$2"
          asset_id=$$(echo "$$RELEASE_META" | jq -r --arg name "$$asset_name" '.assets[] | select(.name == $$name) | .id')
          if [ -z "$$asset_id" ] || [ "$$asset_id" = "null" ]; then
            echo "ERROR: Asset '$$asset_name' not found in release v$$KEYCLOAK_PLUGIN_VERSION"
            exit 1
          fi
          curl -fL \
            -H "Authorization: Bearer $$GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 300 \
            -o "$$output" \
            "https://api.github.com/repos/skyengpro/keycloak-spi-registry/releases/assets/$$asset_id"
        }

        echo "Fetching release metadata for v$$KEYCLOAK_PLUGIN_VERSION...";
        RELEASE_META=$$(curl -fsSL \
          -H "Authorization: Bearer $$GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/skyengpro/keycloak-spi-registry/releases/tags/v$$KEYCLOAK_PLUGIN_VERSION")

        echo "Download keybound runtime plugin (required, fail-closed)...";
        gh_download /data/kc-plugins/keycloak-keybound-all.jar "keycloak-keybound-all-$$KEYCLOAK_PLUGIN_VERSION-all.jar"
        gh_download /data/kc-plugins/keycloak-keybound-api-gateway-http.jar "keycloak-keybound-api-gateway-http-$$KEYCLOAK_PLUGIN_VERSION.jar"
        gh_download /data/kc-plugins/keycloak-keybound-custom-endpoint.jar "keycloak-keybound-custom-endpoint-$$KEYCLOAK_PLUGIN_VERSION.jar"
        gh_download /data/kc-plugins/keycloak-keybound-grant-device-key.jar "keycloak-keybound-grant-device-key-$$KEYCLOAK_PLUGIN_VERSION.jar"
        gh_download /data/kc-plugins/keycloak-keybound-user-storage-backend.jar "keycloak-keybound-user-storage-backend-$$KEYCLOAK_PLUGIN_VERSION.jar"
        echo "Downloaded keybound runtime plugin (required)";

    volumes:
      - downloaded_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    ports:
      - '0.0.0.0:9026:9026'
    environment:
      KC_HTTP_PORT: 9026
      # Dev-only credentials. Do not reuse in production; wire secrets via a vault or env injection.
      BACKEND_HTTP_BASE_PATH_e2e-testing: "http://app:3000/kc"
      BACKEND_HTTP_SIGNATURE_SECRET_e2e-testing: "some-very-long-secret"
      BACKEND_HTTP_SIGNATURE_VERSION_e2e-testing: "1"
      BACKEND_HTTP_TELEMETRY_ENABLED_e2e-testing: "true"
      BACKEND_HTTP_ACTOR_e2e-testing: "keycloak-u-e2e-testing"

      BACKEND_HTTP_AUTH_USERNAME: "admin"
      BACKEND_HTTP_AUTH_PASSWORD: "password"

      NONCE_CACHE_TTL_e2e-testing: "60"

      # Dev-only Keycloak bootstrap credentials. Replace for production.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
    entrypoint: /bin/sh
    healthcheck:
      test:
        [
          "CMD",
          "/downloaded/bin/keycloak-healthcheck",
          "--url",
          "http://localhost:9026/realms/e2e-testing",
          "--contains",
          "e2e-testing",
          "--timeout-seconds",
          "3"
        ]
      start_period: 15s
      interval: 5s
      timeout: 4s
      retries: 20
    command:
      - -c
      - |
        set -e
        cp /downloaded/kc-plugins/*.jar /opt/keycloak/providers
        /opt/keycloak/bin/kc.sh start-dev --import-realm --log-level="WARN,com.ssegning.keycloak:debug"
    volumes:
      - ../../.docker/keycloak-config/:/opt/keycloak/data/import/:ro
      - downloaded_data:/downloaded
    depends_on:
      download-core-tools:
        condition: service_completed_successfully
      download-keycloak-plugins:
        condition: service_completed_successfully
      keycloak-healthcheck-builder:
        condition: service_completed_successfully
