services:
  download-core-tools:
    image: alpine/curl
    environment:
      KEYCLOAK_PLUGIN_VERSION: "0.2.6"
      OPENAPI_GENERATOR_VERSION: "7.19.0"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    command:
      - /bin/sh
      - -c
      - |
        set -ex;
        rm -rf /data/*
        mkdir -p /data/bin
        mkdir -p /data/kc-plugins

        apk add --no-cache jq

        # Download from a public URL (e.g. Maven Central)
        download() {
          output="$$1"
          url="$$2"
          curl -fL \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 300 \
            -o "$$output" "$$url"
        }

        # Download a release asset from a private GitHub repo via the REST API.
        # Usage: gh_download <output_path> <asset_filename>
        # Requires RELEASE_META to be set (fetched once below).
        gh_download() {
          output="$$1"
          asset_name="$$2"
          asset_id=$$(echo "$$RELEASE_META" | jq -r --arg name "$$asset_name" '.assets[] | select(.name == $$name) | .id')
          if [ -z "$$asset_id" ] || [ "$$asset_id" = "null" ]; then
            echo "ERROR: Asset '$$asset_name' not found in release v$$KEYCLOAK_PLUGIN_VERSION"
            echo "Available assets:"
            echo "$$RELEASE_META" | jq -r '.assets[].name'
            exit 1
          fi
          curl -fL \
            -H "Authorization: Bearer $$GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            --retry 8 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 300 \
            -o "$$output" \
            "https://api.github.com/repos/skyengpro/keycloak-spi-registry/releases/assets/$$asset_id"
        }

        echo "Download OpenAPI generator (we're using it to generate code from OpenAPI specs...";
        download /data/bin/openapi-generator-cli.jar "https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/$$OPENAPI_GENERATOR_VERSION/openapi-generator-cli-$$OPENAPI_GENERATOR_VERSION.jar"

        echo "Fetching release metadata for v$$KEYCLOAK_PLUGIN_VERSION...";
        RELEASE_META=$$(curl -fsSL \
          -H "Authorization: Bearer $$GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/skyengpro/keycloak-spi-registry/releases/tags/v$$KEYCLOAK_PLUGIN_VERSION")
        echo "Found $$(echo "$$RELEASE_META" | jq '.assets | length') assets in release"

        echo "Download OpenAPI for Keycloak...";
        gh_download /data/keycloak-interface.openapi.yaml "backend.open-api.yml"
        echo "Downloaded OpenAPI for Keycloak";

        echo "Download keybound...";
        gh_download /data/kc-plugins/keycloak-keybound-all.jar "keycloak-keybound-all-$$KEYCLOAK_PLUGIN_VERSION-all.jar"
        gh_download /data/kc-plugins/keycloak-keybound-api-gateway-http.jar "keycloak-keybound-api-gateway-http-$$KEYCLOAK_PLUGIN_VERSION.jar"
        gh_download /data/kc-plugins/keycloak-keybound-custom-endpoint.jar "keycloak-keybound-custom-endpoint-$$KEYCLOAK_PLUGIN_VERSION.jar"
        gh_download /data/kc-plugins/keycloak-keybound-grant-device-key.jar "keycloak-keybound-grant-device-key-$$KEYCLOAK_PLUGIN_VERSION.jar"
        gh_download /data/kc-plugins/keycloak-keybound-user-storage-backend.jar "keycloak-keybound-user-storage-backend-$$KEYCLOAK_PLUGIN_VERSION.jar"
        echo "Downloaded keybound";

    volumes:
      - downloaded_data:/data

  generate-code:
    image: amazoncorretto:21
    user: root
    environment:
      USER_ID: "${USER_ID:-1000}"
      GROUP_ID: "${GROUP_ID:-1000}"
    depends_on:
      download-core-tools:
        condition: service_completed_successfully
    configs:
      - source: oas_server_kc
        target: /tmp/oas_server_kc.json
        mode: 444
      - source: oas_client_cuss
        target: /tmp/oas_client_cuss.json
        mode: 444
      - source: oas_kc_openapi
        target: /tmp/oas_kc_openapi.json
        mode: 444
    volumes:
      - downloaded_data:/data
      - ../../app/gen:/work
      - ../../openapi:/openapi
    command:
      - /bin/sh
      - -c
      - |
        set -e;

        JAR_FILE=/data/bin/openapi-generator-cli.jar

        for item in oas_server_kc oas_client_cuss; do
            echo "Generating $$item..."
            
            # Generate to a local container directory first to avoid bind mount issues
            TMP_DIR="/tmp/gen_$$item"
            rm -rf "$$TMP_DIR"
            mkdir -p "$$TMP_DIR"
            
            java -jar "$$JAR_FILE" generate \
              -c "/tmp/$$item.json" \
              -o "$$TMP_DIR" \
              --skip-validate-spec
            
            # Now move to the bind mount
            echo "Moving $$item to /work..."
            rm -rf "/work/$$item"
            mkdir -p "/work/$$item"
            cp -a "$$TMP_DIR"/. "/work/$$item/"
            rm -rf "$$TMP_DIR"
        done

        # Generate OpenAPI JSON spec for KC (to include in Swagger UI)
        echo "Generating KC OpenAPI JSON..."
        TMP_DIR="/tmp/gen_oas_kc_openapi"
        rm -rf "$$TMP_DIR"
        mkdir -p "$$TMP_DIR"
        java -jar "$$JAR_FILE" generate \
          -c "/tmp/oas_kc_openapi.json" \
          -o "$$TMP_DIR" \
          --skip-validate-spec \
          --global-property=apis=false,models=false,apiDocs=false,modelDocs=false

        # Create directory for KC OpenAPI spec
        mkdir -p /work/kc_openapi
        # The openapi-generator puts the spec in the output root
        cp "$$TMP_DIR"/*.json /work/kc_openapi/ 2>/dev/null || \
          cp "$$TMP_DIR"/openapi.json /work/kc_openapi/ 2>/dev/null || \
          find "$$TMP_DIR" -name "openapi*.json" -exec cp {} /work/kc_openapi/ \; || true
        rm -rf "$$TMP_DIR"

        echo "Fixing permissions for $$USER_ID:$$GROUP_ID..."
        chown -R "$$USER_ID:$$GROUP_ID" /work

volumes:
  downloaded_data:

configs:
  oas_server_kc:
    content: |
      {
        "inputSpec": "/data/keycloak-interface.openapi.yaml",
        "generatorName": "rust-axum",
        "packageName": "gen_oas_server_kc",
        "packageVersion": "9.9.9"
      }
  oas_client_cuss:
    content: |
      {
        "inputSpec": "/openapi/user-storage--cuss.yaml",
        "generatorName": "rust",
        "packageName": "gen_oas_client_cuss",
        "packageVersion": "9.9.9"
      }
  oas_kc_openapi:
    content: |
      {
        "inputSpec": "/data/keycloak-interface.openapi.yaml",
        "generatorName": "openapi",
        "packageName": "kc_openapi",
        "packageVersion": "9.9.9"
      }
