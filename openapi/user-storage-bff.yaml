openapi: 3.1.0
info:
  title: KYC Backend BFF Flow API
  version: 0.2.2
  description: >
    BFF-facing v2 flow runtime API. Only flow sessions, flows, steps, user reads, and upload endpoints remain on this surface.
servers:
  - url: https://kyc-internal.example.local
tags:
  - name: users
  - name: recoveries
  - name: uploads
  - name: sessions
  - name: flows
  - name: steps

paths:
  /users/lookup-by-phone:
    post:
      tags: [ users ]
      summary: Look up candidate accounts by phone number
      description: >
        Server-to-server directory lookup used by the tokenization BFF for
        account recovery phone resolution. Returns EVERY account whose
        phone_number or username matches the supplied E.164 phone, with only
        the minimal fields the BFF recovery resolver needs (least privilege:
        no contact details, timestamps, or arbitrary metadata). The
        `matchedBy` field states which column matched so the caller can
        distinguish an authoritative registered-phone match
        (`matchedBy=phone`) from a username-only match. The phone is
        validated as E.164 server-side; malformed input is rejected with
        400/INVALID_PHONE. POST + JSON body so the literal `+` in E.164
        phones survives transit. NOTE: the older /flow/ path prefixes in
        this document are stale; the live surface is mounted at the bff base
        path with the routes below.
      operationId: lookup_user_by_phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupByPhoneRequest"
      responses:
        "200":
          description: Matching accounts (possibly empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupByPhoneResponse"
        "400":
          description: Phone missing or invalid

  /v1/recoveries/{recovery_case_id}/device-bindings:
    post:
      tags: [ recoveries ]
      summary: Finalize a recovery device bind
      description: >
        Server-to-server call from the tokenization BFF to persist the new
        device binding for a completed recovery case. Authenticated via the
        bearer service-token BFF contract. Idempotent on the Idempotency-Key
        header: a retry with the same key and payload returns
        ALREADY_BOUND; the same key with a modified payload or path case ID
        is rejected with 409.
      operationId: recovery_bind
      parameters:
        - name: recovery_case_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Idempotency key; must be a valid UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryBindRequest"
      responses:
        "200":
          description: Device bound (or already bound, idempotent retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentBindResponse"
        "400":
          description: Bad request (invalid Idempotency-Key UUID, missing target_user_id)
        "409":
          description: Idempotency-Key reused with a modified payload

  /v1/recoveries/{recovery_case_id}/old-devices/policy:
    post:
      tags: [ recoveries ]
      summary: Apply the old-device policy after a recovery bind
      description: >
        Server-to-server call from the tokenization BFF to revoke or
        quarantine every previously-bound device except the newly bound one
        for a completed recovery case. Authenticated via the bearer
        service-token BFF contract. Idempotent on the Idempotency-Key header.
      operationId: old_devices_policy
      parameters:
        - name: recovery_case_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Idempotency key; must be a valid UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OldDevicePolicyRequest"
      responses:
        "200":
          description: Policy applied (or already applied, idempotent retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OldDevicePolicyResponse"
        "400":
          description: Bad request (invalid Idempotency-Key UUID, case not bound)
        "409":
          description: Idempotency-Key reused with a modified payload

  /flow/users/{userId}:
    get:
      tags: [ users ]
      summary: Get user row by id
      operationId: getFlowUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalUserRecord"

  /flow/users/{userId}/completed-kyc:
    get:
      tags: [ users ]
      summary: Get completed KYC flow markers
      operationId: getFlowUserCompletedKyc
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Completed KYC markers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedKycResponse"

  /uploads/presign:
    post:
      tags: [ uploads ]
      summary: Create presigned upload target
      operationId: presignUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignUploadRequest"
      responses:
        "200":
          description: Presigned upload response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignUploadResponse"

  /uploads/complete:
    post:
      tags: [ uploads ]
      summary: Complete upload registration
      operationId: completeUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteUploadRequest"
      responses:
        "200":
          description: Evidence registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRef"

  /flow/sessions:
    get:
      tags: [ sessions ]
      summary: List flow sessions for the caller
      operationId: listFlowSessions
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowSession"
    post:
      tags: [ sessions ]
      summary: Create a top-level flow session
      operationId: createFlowSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlowSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowSession"

  /flow/sessions/{sessionId}:
    get:
      tags: [ sessions ]
      summary: Get session with nested flows
      operationId: getFlowSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowSessionDetail"

  /flow/sessions/{sessionId}/flows:
    get:
      tags: [ flows ]
      summary: List flows for a session
      operationId: listSessionFlows
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session flows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowInstance"
    post:
      tags: [ flows ]
      summary: Add a flow to a session
      operationId: addFlowToSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFlowRequest"
      responses:
        "201":
          description: Flow created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowInstance"

  /flow/flows/{flowId}:
    get:
      tags: [ flows ]
      summary: Get flow with its steps
      operationId: getFlow
      parameters:
        - $ref: "#/components/parameters/FlowId"
      responses:
        "200":
          description: Flow detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowDetail"

  /flow/flows/{flowId}/steps:
    get:
      tags: [ steps ]
      summary: List steps for a flow
      operationId: listFlowSteps
      parameters:
        - $ref: "#/components/parameters/FlowId"
      responses:
        "200":
          description: Flow steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowStep"

  /flow/steps/{stepId}:
    get:
      tags: [ steps ]
      summary: Get flow step details
      operationId: getFlowStep
      parameters:
        - $ref: "#/components/parameters/StepId"
      responses:
        "200":
          description: Step detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowStep"
    post:
      tags: [ steps ]
      summary: Submit user input for a waiting step
      operationId: submitFlowStep
      parameters:
        - $ref: "#/components/parameters/StepId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFlowStepRequest"
      responses:
        "200":
          description: Step updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowStep"

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
    FlowId:
      name: flowId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: string
        minLength: 8

  schemas:
    InternalUserRecord:
      type: object
      additionalProperties: false
      properties:
        userId: { type: string }
        realm: { type: string }
        username: { type: string }
        fullName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        emailVerified: { type: boolean }
        phoneNumber: { type: string, nullable: true }
        disabled: { type: boolean }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - userId
        - realm
        - username
        - emailVerified
        - disabled
        - metadata
        - createdAt
        - updatedAt

    CompletedKycResponse:
      type: object
      additionalProperties: false
      properties:
        userId: { type: string }
        completedKyc:
          type: object
          additionalProperties: true
      required: [ userId, completedKyc ]

    LookupByPhoneRequest:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          minLength: 1
          pattern: '^\+[1-9]\d{7,14}$'
          description: E.164 phone number to resolve.
        realm:
          type: string
          minLength: 1
          description: >
            Recovery realm requested by the BFF. It must exactly match the server-configured
            recovery realm; other realms are rejected before repository access.
      required: [ phone, realm ]

    LookupByPhoneResponse:
      type: object
      additionalProperties: false
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/LookupByPhoneCandidate"
      required: [ candidates ]

    LookupByPhoneCandidate:
      type: object
      additionalProperties: false
      description: >
        Minimal recovery-resolution candidate. Deliberately excludes contact
        details, timestamps, and arbitrary user metadata (least privilege).
      properties:
        userId:
          type: string
        disabled:
          type: boolean
        matchedBy:
          type: string
          enum: [ phone, username ]
          description: >
            Column that matched the submitted phone. BFF recovery requires
            matchedBy=phone to treat a number as an authoritative registered
            phone.
        fineractClientId:
          type: string
          nullable: true
        fineractCustomerCode:
          type: string
          nullable: true
      required: [ userId, disabled, matchedBy ]

    UploadMethod:
      type: string
      enum: [ PUT ]

    UploadEncryptionMode:
      type: string
      enum: [ SSE_S3, SSE_KMS, SSE_C ]

    PresignUploadRequest:
      type: object
      additionalProperties: false
      properties:
        sessionId: { type: string }
        stepId: { type: string }
        userId: { type: string }
        purpose: { type: string }
        assetType: { type: string }
        mime: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        encryption:
          type: object
          additionalProperties: false
          properties:
            mode:
              $ref: "#/components/schemas/UploadEncryptionMode"
          required: [ mode ]
      required: [ sessionId, stepId, userId, purpose, assetType, mime, sizeBytes ]

    PresignUploadResponse:
      type: object
      additionalProperties: false
      properties:
        uploadId: { type: string }
        bucket: { type: string }
        objectKey: { type: string }
        method:
          $ref: "#/components/schemas/UploadMethod"
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [ uploadId, bucket, objectKey, method, url, headers, expiresAt ]

    CompleteUploadRequest:
      type: object
      additionalProperties: false
      properties:
        sessionId: { type: string }
        stepId: { type: string }
        uploadId: { type: string }
        bucket: { type: string }
        objectKey: { type: string }
        etag: { type: string, nullable: true }
        computedSha256: { type: string, nullable: true }
      required: [ sessionId, stepId, uploadId, bucket, objectKey ]

    EvidenceRef:
      type: object
      additionalProperties: false
      properties:
        evidenceId: { type: string }
        sessionId: { type: string }
        stepId: { type: string }
        assetType: { type: string }
        sha256: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [ evidenceId, sessionId, stepId, assetType, createdAt ]

    CreateFlowSessionRequest:
      type: object
      additionalProperties: false
      required: [ sessionType ]
      properties:
        sessionType:
          type: string
        humanId:
          type: string
        context:
          type: object
          additionalProperties: true

    AddFlowRequest:
      type: object
      additionalProperties: false
      required: [ flowType ]
      properties:
        flowType:
          type: string
        humanId:
          type: string
        context:
          type: object
          additionalProperties: true
        initialStep:
          type: string

    SubmitFlowStepRequest:
      type: object
      additionalProperties: false
      properties:
        input:
          type: object
          additionalProperties: true

    FlowSession:
      type: object
      additionalProperties: false
      required: [ id, humanId, sessionType, status, context, createdAt, updatedAt ]
      properties:
        id: { type: string }
        humanId: { type: string }
        sessionType: { type: string }
        status: { type: string }
        userId:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FlowInstance:
      type: object
      additionalProperties: false
      required: [ id, humanId, sessionId, flowType, status, stepIds, context, createdAt, updatedAt ]
      properties:
        id: { type: string }
        humanId: { type: string }
        sessionId: { type: string }
        flowType: { type: string }
        status: { type: string }
        currentStep:
          type: string
          nullable: true
        stepIds:
          type: array
          items:
            type: string
        context:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FlowStep:
      type: object
      additionalProperties: false
      required: [ id, humanId, flowId, stepType, actor, status, attemptNo, createdAt, updatedAt ]
      properties:
        id: { type: string }
        humanId: { type: string }
        flowId: { type: string }
        stepType: { type: string }
        actor: { type: string }
        status: { type: string }
        attemptNo: { type: integer }
        input:
          type: object
          additionalProperties: true
          nullable: true
        output:
          type: object
          additionalProperties: true
          nullable: true
        error:
          type: object
          additionalProperties: true
          nullable: true
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    FlowSessionDetail:
      type: object
      additionalProperties: false
      required: [ session, flows ]
      properties:
        session:
          $ref: "#/components/schemas/FlowSession"
        flows:
          type: array
          items:
            $ref: "#/components/schemas/FlowInstance"

    FlowDetail:
      type: object
      additionalProperties: false
      required: [ flow, steps ]
      properties:
        flow:
          $ref: "#/components/schemas/FlowInstance"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FlowStep"

    RecoveryBindRequest:
      type: object
      additionalProperties: false
      required: [ realm, target_user_id, approval_revision, device_id, jkt, public_jwk, binding_operation_id ]
      properties:
        realm:
          type: string
        target_user_id:
          type: string
        approval_revision:
          type: integer
          format: int64
        device_id:
          type: string
        jkt:
          type: string
        public_jwk:
          type: object
          additionalProperties: true
        binding_operation_id:
          type: string

    EnrollmentBindStatus:
      type: string
      enum: [ BOUND, ALREADY_BOUND ]

    EnrollmentBindResponse:
      type: object
      additionalProperties: false
      required: [ status, bound_user_id ]
      properties:
        status:
          $ref: "#/components/schemas/EnrollmentBindStatus"
        bound_user_id:
          type: string
        device_record_id:
          type: string

    OldDevicePolicy:
      type: string
      enum: [ REVOKE_ALL_PREVIOUS, QUARANTINE_ALL_PREVIOUS, KEEP_APPROVED_ALLOWLIST_ONLY ]

    OldDevicePolicyRequest:
      type: object
      additionalProperties: false
      required: [ realm, approval_revision, policy ]
      properties:
        realm:
          type: string
        approval_revision:
          type: integer
          format: int64
        policy:
          $ref: "#/components/schemas/OldDevicePolicy"
        except_device_ids:
          type: array
          items:
            type: string
          description: Device ids to keep active (the newly bound device). Defaults to empty.
        reason:
          type: string
          description: Optional human-readable reason for audit.

    OldDevicePolicyStatus:
      type: string
      enum: [ APPLIED, ALREADY_APPLIED ]

    OldDevicePolicyResponse:
      type: object
      additionalProperties: false
      required: [ status, policy, affected_device_ids ]
      properties:
        status:
          $ref: "#/components/schemas/OldDevicePolicyStatus"
        policy:
          $ref: "#/components/schemas/OldDevicePolicy"
        affected_device_ids:
          type: array
          items:
            type: string
          description: Device record ids that were revoked or quarantined.
